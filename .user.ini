; ==============================================================================
; Falhen Media - Recommended PHP Configuration (.user.ini)
; Automatically loaded by cPanel, PHP-FPM, LiteSpeed, and FastCGI
; Optimized for High-Resolution Photography, Bulk ZIP Packaging & Cloudinary CDN
; ==============================================================================

; Memory & Execution Time (Prevents timeouts during bulk downloads & sync)
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; File Uploads (Supports high-resolution camera RAW and direct portfolio uploads)
file_uploads = On
upload_max_filesize = 128M
post_max_size = 128M

; Error Handling & Security (Hides internal server paths; logs to error_log)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
expose_php = Off

; Session Security & Lifetime
session.cookie_httponly = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 86400

; Output Buffering & Character Encoding
output_buffering = 4096
default_charset = "UTF-8"
date.timezone = "UTC"
