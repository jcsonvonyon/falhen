; ==============================================================================
; Falhen Media - Recommended PHP Configuration (php.ini)
; Fallback for Apache/suPHP environments reading php.ini in Document Root
; ==============================================================================

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

file_uploads = On
upload_max_filesize = 128M
post_max_size = 128M

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
expose_php = Off

session.cookie_httponly = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 86400

output_buffering = 4096
default_charset = "UTF-8"
date.timezone = "UTC"

